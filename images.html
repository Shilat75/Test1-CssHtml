
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images - ChatGPT</title>
    <link rel="stylesheet" href="images.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>
<body>

    <header class="topPage">
        <a href="index.html" class="siteLogo">
            <img src="chatGPT.png" alt="ChatGPT Logo">
            <span>ChatGPT</span>
            <span>^</span>
        </a>

        <div class="buttonicon">
            <button class="login">Log in</button>
            <button class="signup">Sign up for free</button>
            <button class="help" aria-label="Help">
                <span class="material-symbols-outlined">help</span>
            </button>
        </div>
    </header>

    <main class="imagesPage">

        <h1>Images</h1>

        <section class="gallerySection">
            <h2>Try a style on an image</h2>

            <div class="gallery">

                <figure>
                    <img src="girl.jpg" alt="Sketch style">
                    <figcaption>Sketch</figcaption>
                </figure>

                <figure>
                    <img src="dramatic.png" alt="Dramatic style">
                    <figcaption>Dramatic</figcaption>
                </figure>

                <figure>
                    <img src="dubi.png" alt="Plushie style">
                    <figcaption>Plushie</figcaption>
                </figure>

                <figure>
                    <img src="anima.png" alt="Retro anime style">
                    <figcaption>Retro anime</figcaption>
                </figure>

                <figure>
                    <img src="basball.png" alt="Baseball bobblehead">
                    <figcaption>Baseball bobblehead</figcaption>
                </figure>

                <figure>
                    <img src="pearel.png" alt="Doodle style">
                    <figcaption>Doodle</figcaption>
                </figure>

            </div>
        </section>

        <section class="discoverSection">
            <h2>Discover something new</h2>

            <div class="discoverList">

                <article class="discoverCard">
                    <img src="pearel.png" alt="Girl with a Pearl Earring">
                    <span>Me as The Girl with a Pearl</span>
                </article>

                <article class="discoverCard">
                    <img src="girl.png" alt="Product photo">
                    <span>Create a professional product photo</span>
                </article>

                <article class="discoverCard">
                    <img src="girl.jpg" alt="Remove background people">
                    <span>Remove people in the background</span>
                </article>

                <article class="discoverCard">
                    <img src="dubi2.png" alt="Style transformation">
                    <span>Style me</span>
                </article>

                <article class="discoverCard">
                    <img src="anima.png" alt="K-Pop style">
                    <span>What would I look like as a K-Pop star?</span>
                </article>

                <article class="discoverCard">
                    <img src="food.png" alt="Keychain">
                    <span>Turn into a keychain</span>
                </article>

            </div>
        </section>

    </main>

</body>
</html>
